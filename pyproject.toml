[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weft"
version = "0.1.0"
description = "weft —— 元数据×叙事流的 AI 学术写作引擎"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "python-frontmatter>=1.1",
    "typer>=0.12",
    "pyyaml>=6",
    "specmodule[openai]>=0.2.0,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
weft = "weft.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/weft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: 真实 LLM 冒烟（活 API 调用；默认排除，pytest -m smoke 显式运行）",
]
addopts = "-m 'not smoke'"
